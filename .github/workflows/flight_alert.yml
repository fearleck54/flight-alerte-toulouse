name: Agent Alertes Vols Toulouse

on:
  workflow_dispatch:
    inputs:
      max_price:
        description: "Prix max aller-retour (Ã¢ÂÂ¬)"
        required: false
        default: "80"
      date_from:
        description: "DÃÂ©part ÃÂ  partir du (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "DÃÂ©part avant le (YYYY-MM-DD)"
        required: false
        default: ""
      min_nights:
        description: "DurÃÂ©e min du sÃÂ©jour (nuits)"
        required: false
        default: "2"
      max_nights:
        description: "DurÃÂ©e max du sÃÂ©jour (nuits)"
        required: false
        default: "5"
      max_stops:
        description: "Escales max (0=direct, 1=1 escale, 2=peu importe)"
        required: false
        default: "1"
      days:
        description: "Jours de dÃÂ©part (friday,saturday,sunday,any)"
        required: false
        default: "friday"
      destinations:
        description: "Codes IATA sÃÂ©parÃÂ©s par virgule (vide=toute Europe)"
        required: false
        default: ""

jobs:
  search-flights:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 60
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dÃÂ©pendances
        run: pip install requests

      - name: Restauration du cache (offres dÃÂ©jÃÂ  vues)
        uses: actions/cache@v4
        with:
          path: |
            seen_deals.json
            dest_offset.json
          key: seen-deals-cache
          restore-keys: seen-deals-cache

      - name: Lancement de l'agent
        env:
          # Ã¢ÂÂÃ¢ÂÂ Amadeus (prioritaire) Ã¢ÂÂÃ¢ÂÂ
          AMADEUS_CLIENT_ID:     ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          # Ã¢ÂÂÃ¢ÂÂ SerpAPI (fallback) Ã¢ÂÂÃ¢ÂÂ
          RAPIDAPI_KEY:          ${{ secrets.RAPIDAPI_KEY }}
          SERPAPI_KEY:           ${{ secrets.SERPAPI_KEY }}
          # Ã¢ÂÂÃ¢ÂÂ Telegram Ã¢ÂÂÃ¢ÂÂ
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          # Ã¢ÂÂÃ¢ÂÂ ParamÃÂ¨tres de recherche Ã¢ÂÂÃ¢ÂÂ
          MAX_PRICE:    ${{ github.event.inputs.max_price  || '80' }}
          DATE_FROM:    ${{ github.event.inputs.date_from  || '' }}
          DATE_TO:      ${{ github.event.inputs.date_to    || '' }}
          MIN_NIGHTS:   ${{ github.event.inputs.min_nights || '2' }}
          MAX_NIGHTS:   ${{ github.event.inputs.max_nights || '5' }}
          MAX_STOPS:    ${{ github.event.inputs.max_stops  || '1' }}
          DAYS:         ${{ github.event.inputs.days       || 'friday' }}
          DESTINATIONS: ${{ github.event.inputs.destinations || '' }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
        run: python flight_agent.py

      - name: Sauvegarde du cache
        uses: actions/cache@v4
        with:
          path: |
            seen_deals.json
            dest_offset.json
          key: seen-deals-cache
